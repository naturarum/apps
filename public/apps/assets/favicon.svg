<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Windowed brand gradient: the back half of the anodized run (bronze,
       copper, violet, marine). The pale titanium grey is cropped out so the
       mark stays visible at 16px on a light browser tab strip. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c69a63"/>
      <stop offset="0.2" stop-color="#ad7250"/>
      <stop offset="0.58" stop-color="#8878b4"/>
      <stop offset="1" stop-color="#2f7ad0"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#g)"/>
</svg>
