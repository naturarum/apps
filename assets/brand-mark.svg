<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The naturarum brand gradient, "Cool titanium": neutral titanium grey
       holding the first half, a narrow bronze-copper heat flare, then violet
       into marine. Anodized metal, in order. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cdcdc5"/>
      <stop offset="0.46" stop-color="#c3c0b6"/>
      <stop offset="0.58" stop-color="#c69a63"/>
      <stop offset="0.67" stop-color="#ad7250"/>
      <stop offset="0.81" stop-color="#8878b4"/>
      <stop offset="1" stop-color="#2f7ad0"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#g)"/>
</svg>
